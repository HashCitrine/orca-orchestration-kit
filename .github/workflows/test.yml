name: portable installer tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
        exclude:
          # ubuntu-latest no longer ships Python 3.9; cover 3.9 on Linux with 22.04.
          - os: ubuntu-latest
            python: '3.9'
        include:
          - os: ubuntu-22.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
